name: Revue IA de la Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
      OLLAMA_TIMEOUT: 1800
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout du robot approuvé
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer le robot
        run: python -m pip install -e .

      - name: Installer Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Démarrer Ollama et charger Qwen
        shell: bash
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent "$OLLAMA_URL/api/tags" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent "$OLLAMA_URL/api/tags" >/dev/null
          ollama pull "$OLLAMA_MODEL"

      - name: Lire le numéro de l'issue depuis la Pull Request
        shell: bash
        run: |
          issue_number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' | sed -nE 's/^[[:space:]]*Issue:[[:space:]]*#?([0-9]+).*$/\1/p' | head -n 1)"
          test -n "$issue_number"
          echo "ISSUE_NUMBER=$issue_number" >> "$GITHUB_ENV"

      - name: Exécuter les sept agents
        run: |
          python -m review.cli review \
            --issue "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --standards examples/STANDARDS.md \
            --out runs

      - name: Publier le rapport comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: review-report-${{ github.event.pull_request.head.sha }}
          path: runs/
          if-no-files-found: error
          retention-days: 7
