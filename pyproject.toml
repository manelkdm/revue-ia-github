[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "revue-ia-github"
version = "0.3.0"
description = "Sept agents de revue de PR, avec GitHub Issues et GitHub Actions"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.scripts]
revue-ia = "review.cli:main"

[tool.setuptools.packages.find]
include = ["review*"]
